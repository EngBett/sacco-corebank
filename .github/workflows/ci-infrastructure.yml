name: ci-infrastructure
on:
  pull_request:
    paths: ["infrastructure/**", "backend/Dockerfile", "frontend/*/Dockerfile", "docker-compose.yml", ".github/workflows/ci-infrastructure.yml"]
jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - name: Format check
        run: terraform fmt -check -recursive infrastructure
      - name: Validate ${{ matrix.environment }}
        working-directory: infrastructure/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false && terraform validate -no-color
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
            target: api
          - name: seed
            dockerfile: backend/Dockerfile
            target: seed
          - name: portal
            dockerfile: frontend/portal/Dockerfile
            target: run
          - name: public-site
            dockerfile: frontend/public-site/Dockerfile
            target: run
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: sacco-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
